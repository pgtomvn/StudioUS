<!doctype html>
<!--
  Nguồn của ảnh banner README (docs/assets/readme-banner.png).
  Chỉ dùng tài nguyên cục bộ của dự án: ảnh pixel trong src/assets/pixel, font trong src/assets/fonts.
  Xuất lại ảnh (2560x640) bằng Edge/Chrome headless, ví dụ:
    msedge --headless=new --hide-scrollbars --force-device-scale-factor=2 --window-size=1280,320 ^
      --screenshot=D:\NMCNTT\docs\assets\readme-banner.png file:///D:/NMCNTT/docs/assets/readme-banner.html
-->
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>StudioUS banner</title>
    <style>
      @font-face {
        font-family: "Handjet";
        font-weight: 800;
        src: url("../../src/assets/fonts/handjet-latin-800-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF;
      }
      @font-face {
        font-family: "Handjet";
        font-weight: 800;
        src: url("../../src/assets/fonts/handjet-vietnamese-800-normal.woff2") format("woff2");
        unicode-range:
          U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301,
          U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }
      @font-face {
        font-family: "Handjet";
        font-weight: 800;
        src: url("../../src/assets/fonts/handjet-latin-ext-800-normal.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+1E00-1E9F, U+2020, U+20A0-20AB, U+20AD-20C0;
      }
      @font-face {
        font-family: "Galmuri9";
        src: url("../../src/assets/fonts/galmuri9-vi.woff2") format("woff2");
      }

      :root {
        --line: #1c1936;
        --side: #2b2850;
        --ink: #fff4dc;
        --ink-dim: #cfc8ec;
        --title: #ffd36b;
        --accent: #ffc247;
        --accent-ink: #33210a;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1280px;
        height: 320px;
        overflow: hidden;
        background: var(--side);
      }
      .banner {
        position: relative;
        width: 1280px;
        height: 320px;
        overflow: hidden;
        background: url("../../src/assets/pixel/bg-sunset.png") center 62% / 1280px auto no-repeat;
        image-rendering: pixelated;
      }
      /* Lớp tối dần sang trái để chữ dễ đọc, nền phải vẫn thấy lâu đài và núi */
      .banner::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgb(28 25 54 / 0.92) 0%,
          rgb(28 25 54 / 0.82) 42%,
          rgb(28 25 54 / 0.15) 72%,
          rgb(28 25 54 / 0) 100%
        );
      }
      /* Viền pixel trên/dưới */
      .banner::after {
        content: "";
        position: absolute;
        inset: 0;
        border-top: 8px solid var(--line);
        border-bottom: 8px solid var(--line);
        box-shadow:
          inset 0 4px 0 var(--accent),
          inset 0 -4px 0 var(--accent);
        pointer-events: none;
      }
      .content {
        position: absolute;
        left: 64px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .shield {
        width: 80px;
        height: 80px;
        image-rendering: pixelated;
        filter: drop-shadow(4px 4px 0 var(--line));
      }
      .name {
        font-family: "Handjet", monospace;
        font-weight: 800;
        font-size: 104px;
        line-height: 0.9;
        letter-spacing: 0.04em;
        color: var(--accent);
        text-shadow:
          4px 4px 0 var(--line),
          -4px 4px 0 var(--line),
          4px -4px 0 var(--line),
          -4px -4px 0 var(--line),
          0 9px 0 var(--line);
      }
      .tagline {
        font-family: "Galmuri9", monospace;
        font-size: 30px;
        color: var(--ink);
        text-shadow: 2px 2px 0 var(--line);
      }
      /* Linh vật: khung đầu của sprite 7 khung 32x32, phóng 6 lần */
      .mascot {
        position: absolute;
        right: 120px;
        bottom: 30px;
        width: 192px;
        height: 192px;
        background: url("../../src/assets/pixel/mascot-sunset.png") 0 0 / 1344px 192px no-repeat;
        image-rendering: pixelated;
        filter: drop-shadow(6px 6px 0 rgb(20 16 44 / 0.55));
      }
      .bubble {
        position: absolute;
        right: 300px;
        top: 46px;
        font-family: "Galmuri9", monospace;
        font-size: 16px;
        padding: 8px 12px 7px;
        background: var(--ink);
        color: var(--line);
        border: 3px solid var(--line);
        box-shadow: 3px 3px 0 var(--line);
      }
      .bubble::after {
        content: "";
        position: absolute;
        right: -15px;
        bottom: 8px;
        width: 12px;
        height: 12px;
        background: var(--ink);
        border-top: 3px solid var(--line);
        border-right: 3px solid var(--line);
        transform: rotate(45deg);
      }
      .icons {
        position: absolute;
        right: 40px;
        top: 40px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .icons img {
        width: 40px;
        height: 40px;
        image-rendering: pixelated;
        filter: drop-shadow(3px 3px 0 var(--line));
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="content">
        <div class="brand">
          <img class="shield" src="../../src/assets/pixel/icon-shield.png" alt="" />
          <span class="name">StudioUS</span>
        </div>
        <p class="tagline">Quản lí tiến độ học tập cá nhân</p>
      </div>
      <div class="bubble">Qua môn hết nha!</div>
      <div class="mascot"></div>
      <div class="icons">
        <img src="../../src/assets/pixel/icon-book.png" alt="" />
        <img src="../../src/assets/pixel/icon-calendar.png" alt="" />
        <img src="../../src/assets/pixel/icon-star.png" alt="" />
        <img src="../../src/assets/pixel/icon-coin.png" alt="" />
      </div>
    </div>
  </body>
</html>
